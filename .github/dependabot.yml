version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-e-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react", "@types/react-dom"]
      testes:
        patterns: ["vitest", "@playwright/test"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
